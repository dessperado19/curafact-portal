<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Curafact</title>
<style>
:root{--blue:#0E4A8B;--blue2:#07345f;--cyan:#20C6D4;--bg:#f5f8fb;--border:#dbe7f0;--text:#16324f;--muted:#66788a;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:1500px;margin:0 auto;padding:12px 14px 40px}
#head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 14px}
#head img{height:34px}
#head .who{flex:1;text-align:right;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#head .who strong{color:var(--blue)}
button{font-family:inherit;border:1px solid var(--border);background:#fff;color:var(--blue);border-radius:10px;font-weight:700;padding:9px 14px;cursor:pointer;font-size:14px}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
#nav{display:flex;gap:8px;margin:0 0 16px;border-bottom:1px solid var(--border);padding-bottom:12px;overflow-x:auto}
#nav button{flex:none;font-size:15px;padding:10px 18px}
#nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#login{max-width:340px;margin:70px auto 0;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(14,74,139,.15);text-align:center}
#login img{height:44px;margin-bottom:10px}
#login h2{margin:0 0 4px;color:var(--blue)}
#login p{margin:0 0 16px;color:var(--muted);font-size:13px}
#login input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:16px;text-align:center;margin-bottom:10px}
#login input#code{font-size:24px;letter-spacing:7px}
#loginErr{color:#b91c1c;font-size:13px;min-height:16px;margin:4px 0 10px}
.hidden{display:none!important}
</style></head><body>
<div id="login" class="hidden">
  <img src="logo.png" alt="Curafact">
  <h2>Curafact</h2>
  <p>Benutzername und Code aus der Authenticator-App</p>
  <form id="loginForm">
    <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Benutzername">
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    <div id="loginErr"></div>
    <button class="primary" style="width:100%" type="submit">Anmelden</button>
  </form>
</div>
<div class="wrap hidden" id="app">
  <div id="head"><img src="logo.png" alt="Curafact"><span class="who" id="who"></span><button id="logout">Abmelden</button></div>
  <div id="nav"><button data-tab="kunden">Kunden</button><button data-tab="board">Board</button></div>
  <div id="tab-kunden"><div id="kdRoot"></div></div>
  <div id="tab-board" class="hidden"><div id="bdRoot"></div></div>
</div>

<script>
/* Nachweis über einen Beratungsbesuch (§ 37 Abs. 3 SGB XI) im Browser erzeugen: Nachbau von scripts/fill_beratung_nachweis.py
   + scripts/pdf_fill_common.py (Overlay auf den amtlichen Vordruck, Koordinaten aus configs/AOK/beratung_nachweis_mapping.json).
   Benötigt pdf-lib (window.PDFLib). Aufruf: NW.erzeugen({template:ArrayBuffer, mapping:Object}, kunde, besuch, {ik:'…', kassen:[…], sigPersonen:{name:dataurl}}) -> Uint8Array */
(function(root){
'use strict';
var PL=root.PDFLib||(typeof require!=='undefined'?require('pdf-lib'):null);
var MASSNAHMEN_CODES=['pflegekurs','kombinationsleistung','verhinderungspflege','tages_nachtpflege','unterstuetzung_alltag','pflege_hilfsmittel','erneute_pflegebegutachtung','pflegesachleistungen','kurzzeitpflege','wohnraumanpassung','rehabilitationsleistungen','freistellungsmoeglichkeiten','weitere_massnahmen'];
function pad(n,l){return String(n).padStart(l||2,'0')}
function splitName(full){
  full=String(full||'').trim();if(!full)return['',''];
  if(full.indexOf(',')>=0){var i=full.indexOf(',');return[full.slice(i+1).trim(),full.slice(0,i).trim()]}
  var j=full.indexOf(' ');if(j<0)return['',full];
  return[full.slice(0,j).trim(),full.slice(j+1).trim()];
}
function dateDigits(v){
  v=String(v||'').trim();var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v);if(m)return m[3]+m[2]+m[1];
  m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(v);if(m)return pad(m[1])+pad(m[2])+m[3];
  return v.replace(/\D/g,'').slice(0,8);
}
function timeDigits(v){
  v=String(v||'').trim();var m=/^(\d{1,2})[:.](\d{2})$/.exec(v);if(m)return pad(m[1])+m[2];
  return v.replace(/\D/g,'').slice(0,4);
}
function splitWords(text,firstLen){
  text=String(text||'').trim();if(text.length<=firstLen)return[text,''];
  var cut=text.lastIndexOf(' ',firstLen);if(cut<=0)cut=firstLen;
  return[text.slice(0,cut).trim(),text.slice(cut).trim()];
}
function splitAddressFull(addr){
  addr=String(addr||'').trim();if(!addr)return['','','',''];
  var plz='',ort='',vorne=addr,m=/(\d{4,5})\s+(.+)$/.exec(addr);
  if(m){plz=m[1];ort=m[2].trim();vorne=addr.slice(0,m.index).trim().replace(/,+\s*$/,'').trim()}
  var h=/^(.*\S)\s+(\d+\s*[a-zA-Z]?)$/.exec(vorne);
  if(h)return[h[1].trim(),h[2].trim(),plz,ort];

}
function ortDatumVorschlag(customer,besuch){
  var d=new Date(),datum=String(besuch.datum||'').trim()||pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
  var ort='';
  if(besuch.form==='videokonferenz')ort='Rheda-Wiedenbrück';
  else{var a=String((customer||{}).pflege_anschrift||'').trim();var m=/\b\d{5}\s+(.+?)\s*$/.exec(a);ort=m?m[1].trim():(a.indexOf(',')>=0?a.slice(a.lastIndexOf(',')+1).trim():'')}

}
function kasseEintrag(text,kassen){
  var t=String(text||'').toLowerCase();
  for(var i=0;i<(kassen||[]).length;i++){var k=kassen[i];if((k.match||[]).some(function(x){return t.indexOf(x)>=0}))return k}
  return null;
}
function buildValues(customer,besuch,cfg){
  cfg=cfg||{};customer=customer||{};besuch=besuch||{};
  var v={};for(var k in customer)v[k]=customer[k];
  var nm=splitName(customer.pflege_name);v.bn_vorname=nm[0];v.bn_nachname=nm[1];
  v.bn_geburtsdatum=dateDigits(customer.pflege_geburtsdatum);
  var a=splitAddressFull(customer.pflege_anschrift);
  v.bn_strasse=(a[0]+' '+a[1]).trim();v.bn_plz=a[2];v.bn_ort=a[3];
  v.besuch_datum=besuch.datum||'';v.besuch_von=besuch.uhrzeit_von||'';v.besuch_bis=besuch.uhrzeit_bis||'';
  v.besuch_datum_k=dateDigits(besuch.datum||'');v.besuch_von_k=timeDigits(besuch.uhrzeit_von||'');v.besuch_bis_k=timeDigits(besuch.uhrzeit_bis||'');
  v.besuch_videokonferenz=besuch.form==='videokonferenz';
  v.einschaetzung_pflegeperson=besuch.einschaetzung_pflegeperson||'';v.einschaetzung_beratungsperson=besuch.einschaetzung_beratungsperson||'';
  v.sichergestellt_ja=besuch.sichergestellt===true;v.sichergestellt_nein=besuch.sichergestellt===false;v.sichergestellt_grund=besuch.sichergestellt_grund||'';
  var mn=(besuch.massnahmen||[]).slice();v.massnahmen_keine=!!besuch.massnahmen_keine;
  var erl=String(besuch.massnahmen_erlaeuterung||'').trim();
  if(erl&&!v.massnahmen_keine&&mn.indexOf('weitere_massnahmen')<0)mn.push('weitere_massnahmen');
  v.massnahmen_ja=mn.length>0&&!v.massnahmen_keine;
  MASSNAHMEN_CODES.forEach(function(c){v['mn_'+c]=mn.indexOf(c)>=0});
  v.massnahmen_erlaeuterung=besuch.massnahmen_erlaeuterung||'';
  v.beratung_7a_angezeigt=!!besuch.beratung_7a_angezeigt;v.wunsch_7a=!!besuch.wunsch_7a;
  v.einwilligung_ziffer3=!!besuch.einwilligung_ziffer3;v.einwilligung_ziffer4=!!besuch.einwilligung_ziffer4;
  v.einwilligung_inaugenschein=!!besuch.einwilligung_inaugenschein;v.einwilligung_7a_verarbeitung=!!besuch.einwilligung_7a_verarbeitung;
  v.ort_datum_unterschrift=String(besuch.ort_datum_unterschrift||'').trim()||ortDatumVorschlag(customer,besuch);
  v.sig_pflegebeduerftig_dataurl=besuch.sig_pflegebeduerftig_dataurl||'';
  var bn=besuch.beratungsperson_name||'',bf=besuch.beratungsperson_funktion||'';
  var sigBp=besuch.sig_beratungsperson_dataurl||'';
  if(!sigBp&&cfg.sigPersonen){for(var n in cfg.sigPersonen){if(n.trim().toLowerCase()===String(bn).trim().toLowerCase()&&String(cfg.sigPersonen[n]).indexOf('data:image/')===0){sigBp=cfg.sigPersonen[n];break}}}
  v.sig_beratungsperson_stempel_dataurl=sigBp;v.sig_beratungsperson_dataurl=besuch.form==='videokonferenz'?sigBp:'';
  v.beratungsperson_stempel_text=(bn+(bf?'\n'+bf:'')).trim();
  v.ik_nummer_beratung=cfg.ik||'';
  var kt=besuch.kasse_name||customer.pflege_kasse||'',e=kasseEintrag(kt,cfg.kassen);
  var ans=besuch.kasse_anschrift||customer.pflege_kasse_anschrift||(e&&e.anschrift)||'';
  var ka=splitAddressFull(ans),voll=(e&&e.name)||kt,kn=splitWords(voll,29);
  v.kasse_name=kn[0];v.kasse_name2=kn[1];
  if(!v.kasse_name2&&e&&e.name2)v.kasse_name2=e.name2;
  v.kasse_strasse=ka[0];v.kasse_hausnummer=ka[1];v.kasse_plz=ka[2];v.kasse_ort=ka[3];
  return v;
}

/* ---------- Zeichnen (pdf-lib, Koordinaten wie reportlab: Ursprung links unten) ---------- */
var ASC=0.718;  /* Helvetica-Ascent (AFM) */
function safe(font,text){
  var out='';
  for(var i=0;i<text.length;i++){var ch=text[i];if(ch==='\n'||ch==='\r'){out+=ch;continue}try{font.encodeText(ch);out+=ch}catch(e){out+='?'}}
  return out;
}
function wrap(font,text,w,size){
  var lines=[];
  String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').forEach(function(raw){
    var cur='';
    raw.split(' ').forEach(function(word){
      var cand=cur?(cur+' '+word).trim():word;
      if(!cur||font.widthOfTextAtSize(cand,size)<=w)cur=cand;else{lines.push(cur);cur=word}
    });
    lines.push(cur);
  });
  return lines;
}
function drawText(page,font,text,x,y,size,dy){page.drawText(safe(font,text),{x:x,y:y+ASC*size+(dy||0),size:size,font:font})}
function drawComb(page,font,text,x,y,w,count,size,dy){
  text=String(text||'');if(count<=0||!text)return;
  var by=y+ASC*size+(dy||0);
  if(text.length>count){
    var s=size;while(s>6&&font.widthOfTextAtSize(safe(font,text),s)>w)s-=0.5;
    page.drawText(safe(font,text),{x:x+1,y:y+ASC*s+(dy||0),size:s,font:font});return;
  }
  var bw=w/count;
  for(var i=0;i<text.length;i++){
    var ch=text[i];if(ch===' ')continue;ch=safe(font,ch);
    page.drawText(ch,{x:x+i*bw+bw/2-font.widthOfTextAtSize(ch,size)/2,y:by,size:size,font:font});
  }
}
function drawMultiline(page,font,text,x,y,w,h,it){
  text=String(text||'');var size=Number(it.size||10);
  if(it.line_pitch){
    var pitch=Number(it.line_pitch),limit=parseInt(it.max_lines||Math.max(1,Math.floor(h/pitch)),10),cur=size,floor=Number(it.min_size||size);
    var lines=wrap(font,safe(font,text),w,cur);
    while(lines.length>limit&&cur-0.5>=floor){cur-=0.5;lines=wrap(font,safe(font,text),w,cur)}
    if(lines.length>limit){
      lines=lines.slice(0,limit);var last=lines[limit-1];
      while(last&&font.widthOfTextAtSize(last+'...',cur)>w)last=last.slice(0,-1);
      lines[limit-1]=last+'...';
    }
    var top=y+h,off=it.baseline_offset!=null?Number(it.baseline_offset):pitch;
    lines.forEach(function(l,i){page.drawText(l,{x:x,y:top-off-i*pitch,size:cur,font:font})});
    return;
  }
  var lh=size*1.25,mx=Math.max(1,Math.floor(h/lh)),ls=wrap(font,safe(font,text),w,size),tp=y+h;
  ls.slice(0,mx).forEach(function(l,i){page.drawText(l,{x:x,y:tp-ASC*size-i*lh,size:size,font:font})});
}
function drawCross(page,x,y,w,h){
  var m=Math.min(w,h)*0.2,th=Math.max(0.9,Math.min(w,h)*0.11),opt={thickness:th,color:PL.rgb(0,0,0),lineCap:PL.LineCapStyle.Round};
  page.drawLine(Object.assign({start:{x:x+m,y:y+m},end:{x:x+w-m,y:y+h-m}},opt));
  page.drawLine(Object.assign({start:{x:x+m,y:y+h-m},end:{x:x+w-m,y:y+m}},opt));
}
function b64ToBytes(b64){
  if(typeof atob==='function'){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
  return new Uint8Array(Buffer.from(b64,'base64'));
}
async function drawImage(doc,page,src,x,y,w,h,fit){
  if(typeof src!=='string'||src.indexOf('data:')!==0)return;
  var comma=src.indexOf(','),head=src.slice(0,comma),bytes=b64ToBytes(src.slice(comma+1));
  var img=/image\/jpe?g/i.test(head)?await doc.embedJpg(bytes):await doc.embedPng(bytes);
  var iw=img.width,ih=img.height;
  if(fit==='contain'&&w&&h&&iw&&ih){var s=Math.min(w/iw,h/ih),nw=iw*s,nh=ih*s;page.drawImage(img,{x:x+(w-nw)/2,y:y,width:nw,height:nh});return}
  page.drawImage(img,{x:x,y:y,width:w||120,height:h||40});
}

async function erzeugen(assets,customer,besuch,cfg){
  var values=buildValues(customer,besuch,cfg);
  var doc=await PL.PDFDocument.load(assets.template);
  var font=await doc.embedFont(PL.StandardFonts.Helvetica);
  var pages=doc.getPages(),mapping=assets.mapping,byPage={};
  (mapping.pages||[]).forEach(function(p){byPage[parseInt(p.page,10)]=p.items||[]});
  for(var pi=0;pi<pages.length;pi++){
    var page=pages[pi],ph=page.getHeight(),items=byPage[pi]||[];
    for(var ii=0;ii<items.length;ii++){
      var it=items[ii],x=Number(it.x||0),w=Number(it.w||0),h=Number(it.h||0),y=ph-(Number(it.y||0)+h),dy=Number(it.dy||0),val=values[it.key];
      if(it.type==='text'){if(val)drawText(page,font,String(val),x,y,parseInt(it.size||12,10),dy)}
      else if(it.type==='comb'){if(val)drawComb(page,font,val,x,y,w,parseInt(it.count||1,10),Number(it.size||9),dy)}
      else if(it.type==='multiline'){if(val)drawMultiline(page,font,val,x,y,w,h,it)}
      else if(it.type==='checkbox'){if(val)drawCross(page,x,y,w,h)}
      else if(it.type==='image'){if(val)await drawImage(doc,page,val,x,y,w,h,it.fit)}

}
var NW={buildValues:buildValues,erzeugen:erzeugen,splitAddressFull:splitAddressFull,
  async laden(base){
    base=base||'';
    var t=await fetch(base+'assets/nachweis_vordruck.pdf').then(function(r){if(!r.ok)throw new Error('Vordruck nicht gefunden');return r.arrayBuffer()});
    var m=await fetch(base+'assets/nachweis_mapping.json').then(function(r){if(!r.ok)throw new Error('Mapping nicht gefunden');return r.json()});

  }};

})(typeof window!=='undefined'?window:globalThis);
</script>

<script>
/* Beratungsunterlagen (Datenschutzinformation, Beratungsvereinbarung, Vollmacht) im Browser als PDF erzeugen.
   Vorlagen: assets/dokumente/<id>.json (aus den Word-Vorlagen, scripts/dokumente_vorlagen_erzeugen.py), Briefkopf wie in Studio
   (türkise Leiste, Logo, dreispaltige Fußzeile). Benötigt pdf-lib (window.PDFLib).
   Aufruf: DOK.erzeugen(vorlage, werte, {briefkopf:{name,zeilen1,zeilen2,zeilen3}, logo:ArrayBuffer}) -> Uint8Array */
(function(root){
'use strict';
var PL=root.PDFLib||(typeof require!=='undefined'?require('pdf-lib'):null);
var MM=72/25.4, W=595.28, H=841.89;
var M={top:47*MM,left:25*MM,right:20*MM,bottom:36*MM};
var LUECKE='________________', SIG_LINIE='_________________________________';
var TEXT=[0.2,0.2,0.2], BLAU=[15/255,63/255,122/255];
function hexRgb(h){h=String(h||'').replace('#','');if(h.length!==6)return null;return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]}
function b64ToBytes(b64){if(typeof atob==='function'){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}return new Uint8Array(Buffer.from(b64,'base64'))}
function safe(font,text){var o='';for(var i=0;i<text.length;i++){var ch=text[i];if(ch==='\n'){o+=ch;continue}try{font.encodeText(ch);o+=ch}catch(e){o+='?'}}return o}
function fill(text,vals){
  return String(text||'').replace(/\{\{\s*(\w+)\s*\}\}/g,function(_,k){var v=vals[k];if(v==null||v==='')return k.indexOf('sig_')===0?SIG_LINIE:LUECKE;return String(v)});
}
function isSigPara(b){
  var t=(b.runs||[]).map(function(r){return r.x||''}).join('').trim();
  var m=/^\{\{\s*(sig_\w+)\s*\}\}$/.exec(t);return m?m[1]:null;
}
async function erzeugen(vorlage,vals,opts){
  opts=opts||{};vals=vals||{};
  var doc=await PL.PDFDocument.create();
  var F={r:await doc.embedFont(PL.StandardFonts.Helvetica),b:await doc.embedFont(PL.StandardFonts.HelveticaBold),i:await doc.embedFont(PL.StandardFonts.HelveticaOblique),bi:await doc.embedFont(PL.StandardFonts.HelveticaBoldOblique)};
  var logo=opts.logo?await doc.embedPng(opts.logo):null, bk=opts.briefkopf||null;
  var imgCache={};
  async function img(url){
    if(imgCache[url])return imgCache[url];
    var c=url.indexOf(','),head=url.slice(0,c),bytes=b64ToBytes(url.slice(c+1));
    return imgCache[url]=/image\/jpe?g/i.test(head)?await doc.embedJpg(bytes):await doc.embedPng(bytes);
  }
  var page,y;
  function briefkopf(p){
    if(!bk)return;
    p.drawRectangle({x:0,y:H-5*MM,width:W,height:5*MM,color:PL.rgb(22/255,169/255,186/255)});
    if(logo){var lw=61*MM,lh=lw*logo.height/logo.width;p.drawImage(logo,{x:W-M.right-lw,y:H-13*MM-lh,width:lw,height:lh})}
    var fy=H-271*MM;
    p.drawLine({start:{x:0,y:fy},end:{x:W,y:fy},thickness:0.5,color:PL.rgb(0.604,0.639,0.678)});
    var cols=[[25*MM,56*MM,[{t:bk.name,bold:true}].concat((bk.zeilen1||[]).map(function(t){return{t:t}}))],[84*MM,48*MM,(bk.zeilen2||[]).map(function(t){return{t:t}})],[132*MM,58*MM,(bk.zeilen3||[]).map(function(t){return{t:t}})]];
    cols.forEach(function(c){
      var yy=fy-3.2*MM-6.6*0.9;
      c[2].forEach(function(l){
        var f=l.bold?F.b:F.r,words=safe(f,l.t||'').split(' '),cur='';
        var lines=[];words.forEach(function(w){var cand=cur?cur+' '+w:w;if(!cur||f.widthOfTextAtSize(cand,6.6)<=c[1])cur=cand;else{lines.push(cur);cur=w}});lines.push(cur);
        lines.forEach(function(t){p.drawText(t,{x:c[0],y:yy,size:6.6,font:f,color:l.bold?PL.rgb(BLAU[0],BLAU[1],BLAU[2]):PL.rgb(0.42,0.455,0.502)});yy-=6.6*1.55});
      });
    });
  }
  function newPage(){page=doc.addPage([W,H]);briefkopf(page);y=H-M.top}
  newPage();
  var bottom=M.bottom+6*MM*0; /* Inhalt endet 36 mm über dem unteren Rand */
  function fontFor(r){return r.b&&r.i?F.bi:(r.b?F.b:(r.i?F.i:F.r))}
  /* Absatz in Zeilen umbrechen: Liste von {items:[{t,font,size,color}], h, w} */
  function layout(b,width,defSize){
    var toks=[];
    (b.runs||[]).forEach(function(r){
      if(r.pb){toks.push({pb:1});return}
      var size=r.s||defSize,font=fontFor(r),col=hexRgb(r.c)||((r.b&&size>=10.9)?BLAU:TEXT);
      var text=safe(font,fill(r.x,vals));

function statuses(l){var a=(l&&Array.isArray(l.statuses))?l.statuses.slice():[];var rank=function(s){return String(s.name).toLowerCase()==='nicht aktiv'?2:(s.type==='closed'?1:0)};return a.map(function(s,i){return[s,i]}).sort(function(x,y){return rank(x[0])-rank(y[0])||x[1]-y[1]}).map(function(x){return x[0]})}
function isClosedStatus(l,s){var x=statuses(l).find(function(z){return z.name===s});return !!x&&(x.type==='closed'||x.type==='done')}
function listOf(t){return S.lists.find(function(l){return l.id===t.list_id})}
var PREFIX=['Pflegebedürftiger: ','Pflegeberatung: '];
function shownTitle(t){var n=t.title||'';for(var i=0;i<PREFIX.length;i++){if(n.indexOf(PREFIX[i])===0)return n.slice(PREFIX[i].length)}return n}
function initials(u){var x=S.users.find(function(z){return z.username===u});var n=(x&&x.display_name)||u||'?';var p=n.trim().split(/\s+/);return((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase()}
function userName(u){var x=S.users.find(function(z){return z.username===u});return(x&&x.display_name)||u||''}
function me(){return(H().user||{}).username||''}
function visible(t){
  if(!S.allLists&&t.list_id!==S.listId)return false;
  if(S.mine&&(t.assignees||[]).indexOf(me())<0)return false;
  if(S.q){var h=((t.title||'')+' '+(t.customer_name||'')+' '+(t.tags||[]).join(' ')).toLowerCase();if(h.indexOf(S.q.toLowerCase())<0)return false}
  return true;
}

/* ---------- Laden ---------- */
async function load(full){
  var r=await call('board_load',(full||!S.since)?{}:{since:S.since});
  if(!r.ok){msg(r.message||'Board konnte nicht geladen werden.',true);return false}
  if(r.full)S.tasks=new Map();
  if(r.lists)S.lists=r.lists;
  if(r.users)S.users=r.users;
  (r.tasks||[]).forEach(function(t){if(t.deleted_at)S.tasks.delete(t.id);else S.tasks.set(t.id,t)});
  S.since=new Date(Date.parse(r.server_time)-5000).toISOString();
  if(!S.listId||!curList()){var saved=store('list');S.listId=(S.lists.find(function(l){return l.id===saved})||S.lists[0]||{}).id||null}
  S.loaded=true;
  return true;
}
async function refresh(full){if(S.drag||S.modalOpen)return;if(await load(full))render()}

function shell(){

}
function renderBar(){
  var h='<div class="bdTabs">'+S.lists.map(function(l){return'<button class="bdTab'+(l.id===S.listId?' on':'')+'" data-list="'+l.id+'">'+esc(l.name)+'</button>'}).join('')+'</div>';
  h+='<div class="bdViews">'+[['board','Board'],['list','Liste'],['cal','Kalender']].map(function(v){return'<button class="bdViewBtn'+(S.view===v[0]?' on':'')+'" data-view="'+v[0]+'">'+v[1]+'</button>'}).join('')+'</div>';
  h+='<input class="bdSearch" id="bdQ" placeholder="Suchen …" value="'+esc(S.q)+'">';
  h+='<label class="bdChk"><input type="checkbox" id="bdMine"'+(S.mine?' checked':'')+'> Meine</label>';

  h+='<button class="bdBtn" id="bdReload" title="Neu laden">↻</button>';

function render(){
  if(!S.root)return;
  var keep=$('.bdBoard');var sl=keep?keep.scrollLeft:0;
  renderBar();
  if(!S.lists.length){$('#bdBody').innerHTML='<div class="bdEmpty">Noch keine Listen. Ein Administrator kann die Aufgaben mit „Aus ClickUp übernehmen“ importieren.</div>';return}
  if(S.view==='list')renderList();else if(S.view==='cal')renderCal();else renderBoard();
  var b=$('.bdBoard');if(b)b.scrollLeft=sl;
}

/* ---------- Board ---------- */
function cardHtml(t){
  var l=listOf(t),closed=isClosedStatus(l,t.status),m='';
  if(t.priority&&PRIO[t.priority]&&t.priority!=='normal')m+='<span class="bdPrio" title="'+PRIO[t.priority][0]+'" style="background:'+PRIO[t.priority][1]+'"></span>';
  if(t.due_date)m+='<span class="bdChip'+((!closed&&t.due_date<todayStr())?' late':'')+'">'+fmtDate(t.due_date)+'</span>';
  if(t.chk_total)m+='<span class="bdChip'+(t.chk_done===t.chk_total?' done':'')+'">☑ '+t.chk_done+'/'+t.chk_total+'</span>';
  if(t.n_comments)m+='<span class="bdChip">💬 '+t.n_comments+'</span>';
  if(t.n_files)m+='<span class="bdChip">📎 '+t.n_files+'</span>';
  (t.tags||[]).forEach(function(g){m+='<span class="bdChip '+(g==='Duplikat?'?'dup':'tag')+'">'+esc(g)+'</span>'});
  var av=(t.assignees||[]).slice(0,3).map(function(u){return'<span class="bdAv" title="'+esc(userName(u))+'">'+esc(initials(u))+'</span>'}).join('');
  if(av)m+='<span class="bdAvs">'+av+'</span>';
  return'<div class="bdCard'+(String(t.status).toLowerCase()==='nicht aktiv'?' inactive':'')+'" data-id="'+t.id+'"><div class="bdT">'+esc(shownTitle(t))+'</div>'+(m?'<div class="bdMeta">'+m+'</div>':'')+'</div>';
}
function renderBoard(){
  var l=curList();var st=statuses(l);
  var tasks=Array.from(S.tasks.values()).filter(function(t){return t.list_id===S.listId&&visible(t)});
  var h='<div class="bdBoard">';
  st.forEach(function(s){
    var cs=tasks.filter(function(t){return t.status===s.name});
    var closed=s.type==='closed'||s.type==='done';
    cs.sort(closed?function(a,b){return String(b.closed_at||b.updated_at).localeCompare(String(a.closed_at||a.updated_at))}:function(a,b){return a.position-b.position});
    var lim=closed?(S.more[s.name]||15):9999;
    h+='<div class="bdCol" data-status="'+esc(s.name)+'"><div class="bdColHead"><span class="bdDot" style="background:'+esc(s.color||'#66788a')+'"></span>'+esc(s.name)+'<span class="bdCount">'+cs.length+'</span><button class="bdAdd" data-add="'+esc(s.name)+'" title="Aufgabe hinzufügen">+</button></div><div class="bdCards">';
    h+='<div class="bdQuickHost"></div>';
    cs.slice(0,lim).forEach(function(t){h+=cardHtml(t)});
    if(cs.length>lim)h+='<button class="bdMore" data-more="'+esc(s.name)+'">'+(cs.length-lim)+' weitere anzeigen</button>';
    h+='</div></div>';
  });
  $('#bdBody').innerHTML=h+'</div>';
}

/* ---------- Liste ---------- */
function renderList(){
  var l=curList();
  var tasks=Array.from(S.tasks.values()).filter(function(t){return t.list_id===S.listId&&visible(t)});
  var order=statuses(l).map(function(s){return s.name});
  tasks.sort(function(a,b){return order.indexOf(a.status)-order.indexOf(b.status)||a.position-b.position});
  var h='<div style="overflow:auto"><table class="bdTable"><tr><th>Aufgabe</th><th>Status</th><th>Fällig</th><th>Zugewiesen</th><th>Checkliste</th></tr>';
  tasks.forEach(function(t){
    var s=statuses(l).find(function(z){return z.name===t.status})||{};
    h+='<tr class="row" data-id="'+t.id+'"><td><b>'+esc(shownTitle(t))+'</b>'+((t.tags||[]).map(function(g){return' <span class="bdChip tag">'+esc(g)+'</span>'}).join(''))+'</td><td><span class="bdDot" style="display:inline-block;background:'+esc(s.color||'#66788a')+'"></span> '+esc(t.status)+'</td><td>'+fmtDate(t.due_date)+'</td><td>'+(t.assignees||[]).map(function(u){return esc(userName(u))}).join(', ')+'</td><td>'+(t.chk_total?t.chk_done+'/'+t.chk_total:'')+'</td></tr>';
  });
  $('#bdBody').innerHTML=h+'</table></div>'+(tasks.length?'':'<div class="bdEmpty" style="margin-top:10px">Keine Aufgaben.</div>');
}

/* ---------- Kalender ---------- */
function renderCal(){
  var y=S.month.getFullYear(),mo=S.month.getMonth();
  var first=new Date(y,mo,1),offs=(first.getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
  var MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var byDay={};
  S.tasks.forEach(function(t){if(t.due_date&&visible(t)){(byDay[t.due_date]=byDay[t.due_date]||[]).push(t)}});
  var h='<div class="bdMonth"><button class="bdBtn" data-mon="-1">‹</button><span>'+MN[mo]+' '+y+'</span><button class="bdBtn" data-mon="1">›</button><button class="bdBtn" data-mon="0">Heute</button></div><div class="bdCal">';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(function(d){h+='<div class="bdCalHead">'+d+'</div>'});
  var total=Math.ceil((offs+days)/7)*7;
  for(var i=0;i<total;i++){
    var dn=i-offs+1,d=new Date(y,mo,dn),key=ymd(d.getFullYear(),d.getMonth(),d.getDate());
    h+='<div class="bdDay'+(dn<1||dn>days?' out':'')+(key===todayStr()?' today':'')+'"><div class="bdDayNum">'+d.getDate()+'</div>';
    (byDay[key]||[]).forEach(function(t){h+='<button class="bdEv'+(isClosedStatus(listOf(t),t.status)?' done':'')+'" data-id="'+t.id+'" title="'+esc(shownTitle(t))+'">'+esc(shownTitle(t))+'</button>'});
    h+='</div>';
  }
  $('#bdBody').innerHTML=h+'</div>';
}

/* ---------- Ziehen (Maus und Touch) ---------- */
function startDrag(card,x,y){
  var id=card.dataset.id,t=S.tasks.get(id);if(!t)return;
  var g=card.cloneNode(true);g.className='bdCard bdGhost';document.body.appendChild(g);
  card.classList.add('dragging');
  S.drag={id:id,card:card,ghost:g,col:null};
  moveDrag(x,y);
}
function colAt(x,y){
  S.drag.ghost.style.display='none';var el=document.elementFromPoint(x,y);S.drag.ghost.style.display='';
  return el&&el.closest?el.closest('.bdCol'):null;
}
function moveDrag(x,y){
  var d=S.drag;if(!d)return;
  d.ghost.style.left=(x-130)+'px';d.ghost.style.top=(y-20)+'px';
  var c=colAt(x,y);
  if(c!==d.col){if(d.col)d.col.classList.remove('over');if(c)c.classList.add('over');d.col=c}
  var b=$('.bdBoard');
  if(b){var r=b.getBoundingClientRect();if(x<r.left+50)b.scrollLeft-=14;else if(x>r.right-50)b.scrollLeft+=14}
}
function endDrag(x,y){
  var d=S.drag;if(!d)return;
  var col=colAt(x,y)||d.col;
  d.ghost.remove();d.card.classList.remove('dragging');$$('.bdCol.over').forEach(function(c){c.classList.remove('over')});
  S.drag=null;
  if(!col)return;
  var status=col.dataset.status;
  var others=$$('.bdCard',col).filter(function(c){return c!==d.card&&!c.classList.contains('bdGhost')});
  var idx=others.length;
  for(var i=0;i<others.length;i++){var r=others[i].getBoundingClientRect();if(y<r.top+r.height/2){idx=i;break}}
  var pos=function(i){var t=S.tasks.get(others[i].dataset.id);return t?Number(t.position):0};
  var np;
  if(!others.length)np=1000;else if(idx===0)np=pos(0)-1000;else if(idx>=others.length)np=pos(others.length-1)+1000;else np=(pos(idx-1)+pos(idx))/2;
  var t=S.tasks.get(d.id);if(!t)return;
  if(t.status===status&&Math.abs(np-Number(t.position))<1e-9)return;
  var old={status:t.status,position:t.position};
  t.status=status;t.position=np;render();
  call('board_task_move',{id:d.id,status:status,position:np}).then(function(r){
    if(!r.ok){t.status=old.status;t.position=old.position;render();msg(r.message||'Verschieben fehlgeschlagen.',true)}
    else if(r.task){S.tasks.set(d.id,Object.assign({},t,{closed_at:r.task.closed_at,updated_at:r.task.updated_at}));render()}
  });
}
function bindDrag(){
  var root=S.root,st=null,TH=6;
  root.addEventListener('mousedown',function(e){
    if(e.button!==0)return;var c=e.target.closest('.bdCard:not(.bdGhost)');if(!c||!root.contains(c))return;
    st={card:c,x:e.clientX,y:e.clientY,touch:false};
  });
  window.addEventListener('mousemove',function(e){
    if(S.drag){moveDrag(e.clientX,e.clientY);e.preventDefault();return}
    if(st&&!st.touch&&(Math.abs(e.clientX-st.x)>TH||Math.abs(e.clientY-st.y)>TH)){startDrag(st.card,e.clientX,e.clientY);st.started=true}
  });
  window.addEventListener('mouseup',function(e){
    if(S.drag){S.dragJustEnded=true;setTimeout(function(){S.dragJustEnded=false},50);endDrag(e.clientX,e.clientY)}
    st=null;
  });
  root.addEventListener('touchstart',function(e){
    var c=e.target.closest('.bdCard:not(.bdGhost)');if(!c)return;var t=e.touches[0];
    st={card:c,x:t.clientX,y:t.clientY,touch:true};
    clearTimeout(st.timer);
    st.timer=setTimeout(function(){if(st&&st.touch&&!S.drag){startDrag(st.card,st.x,st.y);if(navigator.vibrate)navigator.vibrate(15)}},380);
  },{passive:true});
  root.addEventListener('touchmove',function(e){
    var t=e.touches[0];
    if(S.drag){e.preventDefault();moveDrag(t.clientX,t.clientY);return}
    if(st&&st.touch&&(Math.abs(t.clientX-st.x)>TH||Math.abs(t.clientY-st.y)>TH)){clearTimeout(st.timer);st=null}
  },{passive:false});
  function tEnd(e){
    if(st)clearTimeout(st.timer);
    if(S.drag){var t=(e.changedTouches&&e.changedTouches[0])||{clientX:0,clientY:0};S.dragJustEnded=true;setTimeout(function(){S.dragJustEnded=false},50);endDrag(t.clientX,t.clientY)}
    st=null;
  }
  root.addEventListener('touchend',tEnd);root.addEventListener('touchcancel',tEnd);
}

/* ---------- Dialoge ---------- */
function dlg(o){
  return new Promise(function(res){
    var host=$('#bdDlgHost');
    host.innerHTML='<div class="bdModalBg" id="bdDlgBg"><div class="bdModal small"><h3>'+esc(o.title||'')+'</h3>'+(o.text?'<p style="color:var(--bd-muted)">'+esc(o.text)+'</p>':'')+(o.input!==undefined?'<input type="text" id="bdDlgIn" value="'+esc(o.input)+'">':'')+'<div class="bdRow" style="justify-content:flex-end;margin-top:16px"><button class="bdBtn" id="bdDlgNo">Abbrechen</button><button class="bdBtn '+(o.danger?'danger':'primary')+'" id="bdDlgOk">'+esc(o.ok||'OK')+'</button></div></div></div>';
    var close=function(v){host.innerHTML='';res(v)};
    var inp=$('#bdDlgIn',host);if(inp){inp.focus();inp.select();inp.addEventListener('keydown',function(e){if(e.key==='Enter')close(inp.value.trim()||null);if(e.key==='Escape')close(null)})}
    $('#bdDlgOk',host).onclick=function(){close(inp?(inp.value.trim()||null):true)};
    $('#bdDlgNo',host).onclick=function(){close(inp?null:false)};
  });
}

/* ---------- Aufgabe öffnen ---------- */
function bytesFmt(n){if(!n)return'';return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
async function openTask(id){
  var r=await call('board_task_get',{id:id});
  if(!r.ok){msg(r.message||'Aufgabe konnte nicht geladen werden.',true);return}
  S.modalOpen=true;S.cur=r;drawTask();
}
function closeTask(){S.modalOpen=false;S.cur=null;$('#bdModalHost').innerHTML='';render()}
async function reopen(){if(!S.cur)return;var r=await call('board_task_get',{id:S.cur.task.id});if(r.ok){S.cur=r;S.tasks.set(r.task.id,Object.assign({},S.tasks.get(r.task.id)||{},r.task));drawTask()}else msg(r.message,true)}
async function saveField(f){
  var t=S.cur.task;var r=await call('board_task_save',Object.assign({id:t.id},f));
  if(!r.ok){msg(r.message||'Speichern fehlgeschlagen.',true);return false}
  S.cur.task=r.task;S.tasks.set(r.task.id,Object.assign({},S.tasks.get(r.task.id)||{},r.task));return true;
}
function drawTask(){
  var c=S.cur,t=c.task,l=listOf(t);
  var scroll=($('.bdModalBg')||{}).scrollTop||0;
  var h='<div class="bdModalBg" id="bdTaskBg"><div class="bdModal">';

  h+='<div class="bdGrid"><div><label>Status</label><select id="tStatus">'+statuses(l).map(function(s){return'<option'+(s.name===t.status?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select></div>';
  h+='<div><label>Fällig am</label><input type="date" id="tDue" value="'+esc(t.due_date||'')+'"></div>';
  h+='<div><label>Priorität</label><select id="tPrio"><option value="">–</option>'+Object.keys(PRIO).map(function(k){return'<option value="'+k+'"'+(t.priority===k?' selected':'')+'>'+PRIO[k][0]+'</option>'}).join('')+'</select></div>';
  h+='<div><label>Liste</label><input type="text" value="'+esc((l||{}).name||'')+'" disabled></div></div>';
  h+='<div class="bdSec" style="margin-top:0"><label class="bdLbl">Zugewiesen</label><div class="bdPeople">'+S.users.map(function(u){return'<button class="bdPerson'+((t.assignees||[]).indexOf(u.username)>=0?' on':'')+'" data-user="'+esc(u.username)+'">'+esc(u.display_name||u.username)+'</button>'}).join('')+'</div></div>';
  h+='<div class="bdSec"><label class="bdLbl">Tags</label><div class="bdMeta" style="margin:0 0 6px">'+(t.tags||[]).map(function(g){return'<span class="bdChip tag">'+esc(g)+' <button class="bdX" data-deltag="'+esc(g)+'">×</button></span>'}).join('')+'</div><input type="text" id="tTag" placeholder="Tag eingeben und Enter drücken"></div>';
  h+='<div class="bdSec"><label class="bdLbl">Beschreibung</label><textarea id="tDesc" placeholder="Beschreibung …">'+esc(t.description||'')+'</textarea></div>';
  // Checklisten
  h+='<div class="bdSec"><div class="bdSecHead"><h4>Checklisten</h4><button class="bdBtn" id="clAdd">+ Checkliste</button></div>';

    h+='<input type="text" class="bdItNew" data-cl="'+cl.id+'" placeholder="Eintrag hinzufügen …" style="margin-top:8px"></div>';

  h+='<div class="bdRow" style="justify-content:space-between;margin-top:20px"><button class="bdBtn danger" id="tDel">In den Papierkorb</button><span class="bdLog">Erstellt '+fmtTs(t.created_at)+(t.created_by?' von '+esc(t.created_by):'')+'</span></div>';
  h+='</div></div>';
  $('#bdModalHost').innerHTML=h;
  var bg=$('.bdModalBg');if(bg)bg.scrollTop=scroll;
}

async function taskClick(e){
  var c=S.cur,t=c.task,el=e.target;
  var q=function(a){return el.closest('['+a+']')};
  var x;
  if(el.id==='tClose'||el.id==='bdTaskBg'){closeTask();return}
  if((x=q('data-user'))){var u=x.dataset.user,a=(t.assignees||[]).slice(),i=a.indexOf(u);if(i>=0)a.splice(i,1);else a.push(u);if(await saveField({assignees:a}))drawTask();return}
  if((x=q('data-deltag'))){if(await saveField({tags:(t.tags||[]).filter(function(g){return g!==x.dataset.deltag})}))drawTask();return}
  if(el.id==='clAdd'){var n=await dlg({title:'Neue Checkliste',input:'',ok:'Anlegen'});if(n){var r=await call('board_checklist_add',{task_id:t.id,name:n});if(r.ok)reopen();else msg(r.message,true)}return}
  if((x=q('data-clren'))){var cl=c.checklists.find(function(k){return k.id===x.dataset.clren});var nn=await dlg({title:'Checkliste umbenennen',input:cl.name,ok:'Speichern'});if(nn){var r2=await call('board_checklist_rename',{id:cl.id,name:nn});if(r2.ok)reopen();else msg(r2.message,true)}return}
  if((x=q('data-cldel'))){if(await dlg({title:'Checkliste löschen?',text:'Die Checkliste mit allen Einträgen wird gelöscht.',ok:'Löschen',danger:true})){var r3=await call('board_checklist_delete',{id:x.dataset.cldel});if(r3.ok)reopen();else msg(r3.message,true)}return}
  if((x=q('data-itdel'))){var r4=await call('board_item_delete',{id:x.dataset.itdel});if(r4.ok)reopen();else msg(r4.message,true);return}
  if((x=q('data-itedit'))){
    var id=x.dataset.itedit,it=null;c.checklists.forEach(function(k){k.items.forEach(function(z){if(z.id===id)it=z})});
    var inp=document.createElement('input');inp.type='text';inp.value=it.name;x.replaceWith(inp);inp.focus();
    var done=false,fin=async function(save){if(done)return;done=true;if(save&&inp.value.trim()&&inp.value.trim()!==it.name){var rr=await call('board_item_set',{id:id,name:inp.value.trim()});if(!rr.ok)msg(rr.message,true)}reopen()};
    inp.addEventListener('blur',function(){fin(true)});inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')fin(true);if(ev.key==='Escape')fin(false)});return;
  }
  if((x=q('data-att'))){var ru=await call('board_attachment_url',{id:x.dataset.att});if(ru.ok){if(H().openUrl)H().openUrl(ru.url);else window.open(ru.url,'_blank')}else msg(ru.message,true);return}
  if((x=q('data-attdel'))){if(await dlg({title:'Anhang löschen?',ok:'Löschen',danger:true})){var r5=await call('board_attachment_delete',{id:x.dataset.attdel});if(r5.ok)reopen();else msg(r5.message,true)}return}
  if((x=q('data-cmdel'))){var r6=await call('board_comment_delete',{id:x.dataset.cmdel});if(r6.ok)reopen();else msg(r6.message,true);return}
  if(el.id==='cmAdd'){var tx=$('#cmNew').value.trim();if(!tx)return;var r7=await call('board_comment_add',{task_id:t.id,body:tx});if(r7.ok)reopen();else msg(r7.message,true);return}
  if(el.id==='tDel'){if(await dlg({title:'In den Papierkorb?',text:'Die Aufgabe kann im Papierkorb wiederhergestellt werden.',ok:'In den Papierkorb',danger:true})){var r8=await call('board_task_delete',{id:t.id});if(r8.ok){S.tasks.delete(t.id);closeTask()}else msg(r8.message,true)}return}
}
function taskChange(e){
  var t=S.cur&&S.cur.task,el=e.target;if(!t)return;
  if(el.id==='tStatus')saveField({status:el.value}).then(function(ok){if(ok)reopen()});
  else if(el.id==='tDue')saveField({due_date:el.value||null});
  else if(el.id==='tPrio')saveField({priority:el.value||null});
  else if(el.id==='tTitle'){var v=el.value.trim();if(v&&v!==t.title)saveField({title:v});else el.value=t.title}
  else if(el.id==='tDesc'){if(el.value!==(t.description||''))saveField({description:el.value})}
  else if(el.dataset&&el.dataset.itchk){call('board_item_set',{id:el.dataset.itchk,resolved:el.checked}).then(function(r){if(r.ok)reopen();else msg(r.message,true)})}
  else if(el.id==='tFile'){uploadFiles(el.files)}
}
async function uploadFiles(files){
  var t=S.cur.task;
  for(var i=0;i<files.length;i++){
    var f=files[i];if(f.size>10*1024*1024){msg(f.name+' ist größer als 10 MB.',true);continue}
    var b64=await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1]||'')};fr.onerror=rej;fr.readAsDataURL(f)});
    msg('Lade '+f.name+' hoch …');
    var r=await call('board_attachment_add',{task_id:t.id,file_name:f.name,content_type:f.type,file_b64:b64});
    if(!r.ok)msg(r.message||'Upload fehlgeschlagen.',true);
  }
  reopen();
}
function taskKey(e){
  var el=e.target;if(!S.cur)return;
  if(el.id==='tTag'&&e.key==='Enter'){e.preventDefault();var v=el.value.trim();if(v){var tags=(S.cur.task.tags||[]).slice();if(tags.indexOf(v)<0)tags.push(v);saveField({tags:tags}).then(function(ok){if(ok)drawTask()})}}
  else if(el.classList&&el.classList.contains('bdItNew')&&e.key==='Enter'){e.preventDefault();var n=el.value.trim();if(n)call('board_item_add',{checklist_id:el.dataset.cl,name:n}).then(function(r){if(r.ok)reopen();else msg(r.message,true)})}
  else if(e.key==='Escape')closeTask();
}

/* ---------- Neue Aufgabe / Papierkorb / Import ---------- */
async function createTask(title,status){
  var r=await call('board_task_save',{list_id:S.listId,title:title,status:status});
  if(!r.ok){msg(r.message||'Anlegen fehlgeschlagen.',true);return}
  S.tasks.set(r.task.id,r.task);render();
}
async function showTrash(){
  var r=await call('board_trash_list');if(!r.ok){msg(r.message,true);return}
  var host=$('#bdModalHost');S.modalOpen=true;
  var h='<div class="bdModalBg" id="bdTrashBg"><div class="bdModal"><div class="bdRow"><h3 style="flex:1">Papierkorb</h3><button class="bdBtn" id="trClose">Schließen</button></div>';
  if(!r.tasks.length)h+='<div class="bdLog">Der Papierkorb ist leer.</div>';
  r.tasks.forEach(function(t){h+='<div class="bdFile"><span style="flex:1"><b>'+esc(shownTitle(t))+'</b><br><small style="color:var(--bd-muted)">gelöscht '+fmtTs(t.deleted_at)+'</small></span><button class="bdBtn" data-restore="'+t.id+'">Wiederherstellen</button></div>'});
  host.innerHTML=h+'</div></div>';
}
async function runImport(){
  var host=$('#bdModalHost');S.modalOpen=true;
  var running=false,cancel=false;
  var draw=function(body){host.innerHTML='<div class="bdModalBg"><div class="bdModal"><h3>Aufgaben aus ClickUp übernehmen</h3>'+body+'</div></div>'};
  draw('<p>ClickUp wird nur gelesen, dort wird nichts verändert. Bereits übernommene Aufgaben werden übersprungen.</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="imClose">Abbrechen</button><button class="bdBtn primary" id="imScan">Prüfen</button></div>');
  host.onclick=async function(e){
    if(e.target.id==='imClose'){cancel=true;if(!running){host.onclick=null;host.innerHTML='';S.modalOpen=false;render()}return}
    if(e.target.id==='imDone'){host.onclick=null;host.innerHTML='';S.modalOpen=false;await load(true);render();return}
    if(e.target.id==='imScan'){
      draw('<p>Lese ClickUp …</p>');
      var sc=await call('board_import_scan');
      if(!sc.ok){draw('<p style="color:#b91c1c">'+esc(sc.message||'Fehler')+'</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="imClose">Schließen</button></div>');return}
      S.scan=sc.lists;
      var open=0;sc.lists.forEach(function(l){open+=l.ids.length-l.imported});
      draw('<p>Gefunden:</p><ul>'+sc.lists.map(function(l){return'<li><b>'+esc(l.name)+'</b>: '+l.ids.length+' Aufgaben, davon schon übernommen: '+l.imported+'</li>'}).join('')+'</ul><p>Noch zu übernehmen: <b>'+open+'</b>'+(open?' (dauert etwa '+Math.max(1,Math.round(open/8*10/60))+' Minuten)':'')+'</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="imClose">Abbrechen</button><button class="bdBtn primary" id="imGo">Übernehmen</button></div>');
      return;
    }
    if(e.target.id==='imGo'){
      running=true;cancel=false;
      var tot=0,got=0,fails=[],logTxt='';
      S.scan.forEach(function(l){tot+=l.ids.length});
      var upd=function(txt){draw('<p>'+esc(txt)+'</p><div class="bdProg"><i style="width:'+(tot?Math.min(100,Math.round(got*100/tot)):0)+'%"></i></div><div class="bdLogBox">'+esc(logTxt)+'</div>')};
      var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
      for(var li=0;li<S.scan.length&&!cancel;li++){
        var L=S.scan[li];
        // bereits übernommene Aufgaben werden serverseitig übersprungen
        for(var i=0;i<L.ids.length&&!cancel;i+=8){
          upd('Übernehme „'+L.name+'“ … '+got+' von '+tot);
          var batch=L.ids.slice(i,i+8);
          var r=await call('board_import_tasks',{list_id:L.list_id,ids:batch});
          if(!r.ok){logTxt+='Fehler: '+(r.message||'unbekannt')+'\n';await sleep(8000);r=await call('board_import_tasks',{list_id:L.list_id,ids:batch});if(!r.ok){fails=fails.concat(batch);continue}}
          got+=batch.length;(r.failed||[]).forEach(function(f){fails.push(f)});
          if(r.imported)logTxt+=L.name+': '+r.imported+' übernommen\n';
          if(r.imported)await sleep(5000);
        }
      }
      if(!cancel){
        var st=await call('board_import_stats');
        if(st.ok&&st.pending){
          logTxt+='Anhänge: '+st.pending+' ('+bytesFmt(st.pending_bytes)+')\n';
          var guard=0;
          while(!cancel&&guard++<400){upd('Übernehme Anhänge …');var fr=await call('board_import_files');if(!fr.ok){logTxt+=(fr.message||'Fehler bei Anhängen')+'\n';break}(fr.failed||[]).forEach(function(f){logTxt+='Anhang nicht übernommen: '+f+'\n'});if(!fr.remaining||fr.done===0&&!(fr.failed||[]).length)break}
        }
        var fin=await call('board_import_finish');
        if(fin.ok&&fin.marked)logTxt+='Mögliche Duplikate markiert: '+fin.marked+'\n';
      }
      running=false;
      draw('<p><b>'+(cancel?'Abgebrochen.':'Fertig.')+'</b> '+got+' von '+tot+' Aufgaben verarbeitet.'+(fails.length?' Fehlgeschlagen: '+fails.length+' (Import einfach erneut starten).':'')+'</p><div class="bdLogBox">'+esc(logTxt)+'</div><div class="bdRow" style="justify-content:flex-end;margin-top:12px"><button class="bdBtn primary" id="imDone">Schließen</button></div>');
      return;
    }
  };
}

/* ---------- Duplikate zusammenführen (nur Admin) ---------- */
async function runDupes(){
  var host=$('#bdModalHost');S.modalOpen=true;
  var draw=function(body){host.innerHTML='<div class="bdModalBg"><div class="bdModal small"><h3>Duplikate zusammenführen</h3>'+body+'</div></div>'};
  var close=async function(reload){host.onclick=null;host.innerHTML='';S.modalOpen=false;if(reload)await load(true);render()};
  draw('<p>Prüfe …</p>');
  var r=await call('board_dupes_merge',{dry:true});
  if(!r.ok){draw('<p style="color:#b91c1c">'+esc(r.message||'Fehler')+'</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="dpClose">Schließen</button></div>');host.onclick=function(e){if(e.target.id==='dpClose')close(false)};return}
  if(!r.duplicates){draw('<p>Keine doppelten Aufgaben gefunden.</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="dpClose">Schließen</button></div>');host.onclick=function(e){if(e.target.id==='dpClose')close(false)};return}
  draw('<p><b>'+r.duplicates+'</b> doppelte Aufgaben in <b>'+r.groups+'</b> Gruppen (gleicher Kundenname).</p><p class="bdLog">Beispiele: '+esc((r.examples||[]).join(', '))+'</p><p>Die älteste Aufgabe bleibt. Checklisten-Einträge, Kommentare und Anhänge der anderen wandern dorthin, die Dublette landet im Papierkorb (wiederherstellbar). Als Status gilt der der zuletzt bearbeiteten Aufgabe.</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="dpClose">Abbrechen</button><button class="bdBtn primary" id="dpGo">Zusammenführen</button></div>');
  var running=false;
  host.onclick=async function(e){
    if(e.target.id==='dpClose'&&!running){close(false);return}
    if(e.target.id==='dpDone'){close(true);return}
    if(e.target.id==='dpGo'){
      running=true;var done=0,guard=0,total=r.groups;
      while(guard++<200){
        draw('<p>Führe zusammen … '+done+' von '+total+' Gruppen</p><div class="bdProg"><i style="width:'+Math.round(done*100/Math.max(1,total))+'%"></i></div>');
        var m=await call('board_dupes_merge',{dry:false,limit:8});
        if(!m.ok){draw('<p style="color:#b91c1c">'+esc(m.message||'Fehler')+' (nochmal starten setzt fort)</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="dpDone">Schließen</button></div>');running=false;return}
        done+=m.merged;if(!m.remaining)break;
      }
      running=false;
      draw('<p><b>Fertig.</b> '+done+' Gruppen zusammengeführt.</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn primary" id="dpDone">Schließen</button></div>');
    }
  };
}

/* ---------- Ereignisse ---------- */
function bindEvents(){
  var root=S.root;
  root.addEventListener('click',async function(e){
    var el=e.target;
    if(S.dragJustEnded)return;
    var host=$('#bdModalHost');
    if(S.modalOpen&&host.contains(el)){
      if(S.cur&&$('#bdTaskBg'))return taskClick(e);
      if(el.id==='trClose'||el.id==='bdTrashBg'){S.modalOpen=false;host.innerHTML='';render();return}
      var rs=el.closest('[data-restore]');if(rs){var r=await call('board_task_restore',{id:rs.dataset.restore});if(r.ok){msg('Wiederhergestellt');await load(true);showTrash()}else msg(r.message,true)}
      return;
    }
    var x;
    if((x=el.closest('[data-list]'))){S.listId=x.dataset.list;store('list',S.listId);render();return}
    if((x=el.closest('[data-view]'))){S.view=x.dataset.view;store('view',S.view);render();return}
    if(el.id==='bdReload'){refresh(true);return}
    if(el.id==='bdTrash'){showTrash();return}
    if(el.id==='bdImport'){runImport();return}
    if(el.id==='bdDupes'){runDupes();return}
    if(el.id==='bdNew'){var t=await dlg({title:'Neue Aufgabe',input:'',ok:'Anlegen'});if(t)createTask(t,null);return}
    if((x=el.closest('[data-add]'))){
      var colEl=x.closest('.bdCol'),qh=$('.bdQuickHost',colEl);if(qh.firstChild)return;
      qh.innerHTML='<input class="bdQuick" placeholder="Titel, Enter zum Anlegen">';var inp=$('input',qh);inp.focus();
      var done=false;inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&inp.value.trim()){done=true;createTask(inp.value.trim(),x.dataset.add)}if(ev.key==='Escape'){done=true;qh.innerHTML=''}});
      inp.addEventListener('blur',function(){if(!done)qh.innerHTML=''});return;
    }
    if((x=el.closest('[data-more]'))){S.more[x.dataset.more]=(S.more[x.dataset.more]||15)+30;render();return}
    if((x=el.closest('[data-mon]'))){var d=Number(x.dataset.mon);S.month=d===0?new Date():new Date(S.month.getFullYear(),S.month.getMonth()+d,1);render();return}
    if((x=el.closest('.bdCard,.bdEv,tr.row'))&&x.dataset.id){openTask(x.dataset.id);return}
  });
  root.addEventListener('input',function(e){
    if(e.target.id==='bdQ'){S.q=e.target.value;clearTimeout(S.qt);S.qt=setTimeout(function(){var pos=e.target.selectionStart;render();var q=$('#bdQ');q.focus();q.setSelectionRange(pos,pos)},200)}
  });
  root.addEventListener('change',function(e){
    if(e.target.id==='bdMine'){S.mine=e.target.checked;render()}
    else if(e.target.id==='bdAll'){S.allLists=e.target.checked;render()}
    else if(S.cur)taskChange(e);
  });
  root.addEventListener('keydown',taskKey);
  bindDrag();
}

/* ---------- Start ---------- */
var BD={
  async init(rootEl){
    S.root=rootEl;shell();bindEvents();
    var v=store('view');if(v==='list'||v==='cal'||v==='board')S.view=v;
    $('#bdBody').innerHTML='<div class="bdEmpty">Lade Board …</div>';
    if(await load(true)){render();try{var tid=new URLSearchParams(location.search).get('task');if(tid)openTask(tid)}catch(e){}}
    clearInterval(S.timer);
    S.timer=setInterval(function(){if(!document.hidden&&S.root&&S.root.offsetParent!==null)refresh(false)},60000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.root&&S.root.offsetParent!==null)refresh(false)});
  },
  async show(){if(S.loaded)refresh(false);else if(S.root){if(await load(true))render()}},
  stop(){clearInterval(S.timer)}
};
window.BD=BD;
})();
</script>

.kdFaellig{background:#fff;border:1px solid var(--k-border);border-radius:14px;padding:12px 14px;margin-bottom:14px}.kdFaellig h4{margin:0 0 8px;color:var(--k-blue)}.kdFaellig .it{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #eef3f7;cursor:pointer}.kdFaellig .it:last-child{border-bottom:0}.kdFaellig .it b{flex:1}

.kdSig{display:block;max-height:90px;max-width:100%;background:#fff;border:1px dashed var(--k-border);border-radius:10px;padding:6px}

.kdProg{height:10px;background:#e3edf4;border-radius:99px;overflow:hidden;margin:10px 0}.kdProg i{display:block;height:100%;background:var(--k-blue);width:0}
.kdBox{background:#f2f6f9;border-radius:10px;padding:10px;font-size:12px;max-height:160px;overflow:auto;white-space:pre-wrap}
@media(max-width:700px){.kdBes .grid{grid-template-columns:1fr}.kdGrid{grid-template-columns:1fr}.kdPg{grid-template-columns:60px 1fr 1fr}.kdModalBg{padding:0}.kdModal{border-radius:0;min-height:100vh;max-width:none}.kdSearch{max-width:none;flex-basis:100%}.kdHideM{display:none}}
</style>
<script>
(function(){
'use strict';
var S={root:null,list:[],q:'',filter:'aktiv',loaded:false,cur:null,toastT:null};
var KASSEN=['AOK NordWest','AOK NW','Barmer','DAK','TK','KKH','Knappschaft','HanseMerkur','IKK classic','BKK','Techniker Krankenkasse'];
var ARTEN={nachweis:'Nachweis',vereinbarung:'Beratungsvereinbarung',datenschutz:'Datenschutzinformation',vollmacht:'Vollmacht',vertrag:'Vertrag',sonstiges:'Sonstiges'};
function H(){return window.BD_HOST||{}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s,r){return (r||S.root).querySelector(s)}
async function call(a,p){try{var r=await H().call(a,p||{});return r||{ok:false,message:'Keine Antwort vom Server.'}}catch(e){return{ok:false,message:'Fehler: '+e}}}
function msg(t,err){var el=$('.kdToast');el.textContent=t;el.className='kdToast'+(err?' err':'');el.style.display='block';clearTimeout(S.toastT);S.toastT=setTimeout(function(){el.style.display='none'},err?6000:2500)}
function fmtTs(t){if(!t)return'';var d=new Date(t);return isNaN(d)?'':d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function parseDe(s){var m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s||'');return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function bytesFmt(n){if(!n)return'';return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function toIso(de){var m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(de||'');return m?m[3]+'-'+m[2]+'-'+m[1]:''}
function fromIso(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'.'+m[2]+'.'+m[1]:''}

async function load(){
  var r=await call('kunden_list');
  if(!r.ok){msg(r.message||'Kunden konnten nicht geladen werden.',true);return false}
  S.list=r.kunden||[];S.loaded=true;return true;
}
function shell(){S.root.innerHTML='<div class="kd"><div class="kdBar" id="kdBar"></div><div id="kdBody"></div><div class="kdToast" style="display:none"></div><div id="kdModalHost"></div><div id="kdDlgHost"></div></div>'}
function visible(k){
  var s=k.summary||{};
  if(S.filter==='aktiv'&&!k.aktiv)return false;
  if(S.filter==='beratung'&&(!k.aktiv||!s.beratung))return false;
  if(S.filter==='inaktiv'&&k.aktiv)return false;
  if(S.q){var h=(k.name+' '+(s.kasse||'')+' '+(s.anschrift||'')).toLowerCase();if(h.indexOf(S.q.toLowerCase())<0)return false}
  return true;
}
function renderBar(){
  var f=function(id,l){return'<button class="kdBtn'+(S.filter===id?' on':'')+'" data-filter="'+id+'">'+l+'</button>'};
  var h=f('aktiv','Aktive')+f('beratung','Beratung')+f('inaktiv','Inaktive');
  h+='<input class="kdSearch" id="kdQ" placeholder="Suchen …" value="'+esc(S.q)+'"><span class="kdSpacer"></span><button class="kdBtn primary" id="kdNew">+ Neuer Kunde</button>';
  if(H().isAdmin)h+='<button class="kdBtn" id="kdImport">Import aus Studio</button>';
  h+='<button class="kdBtn" id="kdReload" title="Neu laden">↻</button>';
  $('#kdBar').innerHTML=h;
}
function render(){
  renderBar();
  var rows=S.list.filter(visible);
  var heute0=new Date();heute0.setHours(0,0,0,0);var grenze=new Date(heute0.getTime()+21*86400000);
  var faellig=S.list.filter(function(k){var s=k.summary||{},t=parseDe(s.naechster_termin);return k.aktiv&&s.beratung&&t&&t<=grenze}).sort(function(a,b){return parseDe(a.summary.naechster_termin)-parseDe(b.summary.naechster_termin)});
  var fh='';
  if(faellig.length){fh='<div class="kdFaellig"><h4>Fällige Beratungstermine ('+faellig.length+')</h4>'+faellig.slice(0,12).map(function(k){var t=parseDe(k.summary.naechster_termin);return'<div class="it" data-id="'+k.id+'"><b>'+esc(k.name)+'</b><span class="kdChip'+(t<heute0?' late':'')+'">'+esc(k.summary.naechster_termin)+(t<heute0?' – überfällig':'')+'</span></div>'}).join('')+(faellig.length>12?'<div class="kdLog" style="margin-top:6px">… und '+(faellig.length-12)+' weitere (Liste unten nach „Nächster Termin“ prüfen)</div>':'')+'</div>'}
  var h=fh+'<div style="overflow:auto"><table class="kdTable"><tr><th>Name</th><th>Kasse</th><th>PG</th><th>Nächster Termin</th><th class="kdHideM">Letzter Besuch</th><th class="kdHideM">Anschrift</th></tr>';
  var heute=new Date();heute.setHours(0,0,0,0);
  rows.forEach(function(k){
    var s=k.summary||{},t=parseDe(s.naechster_termin);
    h+='<tr class="row'+(k.aktiv?'':' off')+'" data-id="'+k.id+'"><td><b>'+esc(k.name)+'</b>'+(s.beratung?' <span class="kdChip ber">Beratung</span>':'')+'</td><td>'+esc(s.kasse||'')+'</td><td>'+esc(s.pflegegrad||'')+'</td><td>'+(s.naechster_termin?'<span class="kdChip'+(t&&t<heute?' late':'')+'">'+esc(s.naechster_termin)+'</span>':'')+'</td><td class="kdHideM">'+esc(s.letzter_besuch||'')+'</td><td class="kdHideM">'+esc(s.anschrift||'')+'</td></tr>';
  });
  $('#kdBody').innerHTML=h+'</table></div>'+(rows.length?'<div class="kdLog" style="margin-top:8px">'+rows.length+' Einträge</div>':'<div class="kdEmpty" style="margin-top:10px">Keine Kunden gefunden.</div>');
}

/* ---------- Dialoge ---------- */
function dlg(o){
  return new Promise(function(res){
    var host=$('#kdDlgHost');
    host.innerHTML='<div class="kdModalBg"><div class="kdModal small"><h3>'+esc(o.title||'')+'</h3>'+(o.text?'<p style="color:var(--k-muted)">'+esc(o.text)+'</p>':'')+'<div class="kdRow" style="justify-content:flex-end;margin-top:16px"><button class="kdBtn" id="kdDlgNo">Abbrechen</button><button class="kdBtn '+(o.danger?'danger':'primary')+'" id="kdDlgOk">'+esc(o.ok||'OK')+'</button></div></div></div>';
    $('#kdDlgOk',host).onclick=function(){host.innerHTML='';res(true)};
    $('#kdDlgNo',host).onclick=function(){host.innerHTML='';res(false)};
  });
}

/* ---------- Kundenakte ---------- */
async function openKunde(id){
  var r=await call('kunden_get',{id:id});
  if(!r.ok){msg(r.message||'Akte konnte nicht geladen werden.',true);return}
  S.cur={id:r.kunde.id,version:r.kunde.version,aktiv:r.kunde.aktiv,data:JSON.parse(JSON.stringify(r.kunde.data||{})),dok:r.dokumente||[],isNew:false};
  draw();
}
function newKunde(){
  S.cur={id:null,version:null,aktiv:true,data:{pflege_name:'',pflege_anschrift:'',pflege_kvnr:'',pflege_kasse:'',pflege_geburtsdatum:'',pflegegrade:[],pflegeberatung_kunde:true},dok:[],isNew:true};
  draw();
}
function field(id,label,val,extra){return'<div class="'+((extra&&extra.wide)?'wide':'')+'"><label>'+label+'</label><input type="text" id="'+id+'" value="'+esc(val||'')+'"'+((extra&&extra.list)?' list="'+extra.list+'"':'')+((extra&&extra.ph)?' placeholder="'+extra.ph+'"':'')+'></div>'}
function draw(){
  var c=S.cur,d=c.data;
  var h='<div class="kdModalBg" id="kdBg"><div class="kdModal">';
  h+='<div class="kdHead"><h3>'+(c.isNew?'Neuer Kunde':esc(d.pflege_name||''))+'</h3>'+(c.aktiv?'':'<span class="kdChip">inaktiv</span>')+'<button class="kdBtn primary" id="kdSave">Speichern</button><button class="kdBtn" id="kdClose">Schließen</button></div>';
  h+='<datalist id="kdKassen">'+KASSEN.map(function(k){return'<option value="'+esc(k)+'">'}).join('')+'</datalist>';
  h+='<div class="kdGrid">'+field('f_name','Name der pflegebedürftigen Person',d.pflege_name,{wide:1})+field('f_geb','Geburtsdatum (TT.MM.JJJJ)',d.pflege_geburtsdatum)+field('f_kvnr','Versichertennummer',d.pflege_kvnr)+field('f_kasse','Pflegekasse',d.pflege_kasse,{list:'kdKassen'})+field('f_anschr','Anschrift',d.pflege_anschrift,{wide:1})+'</div>';
  h+='<div class="kdRow"><label class="k" style="display:flex;gap:6px;align-items:center;text-transform:none;font-size:14px;color:var(--k-text)"><input type="checkbox" id="f_ber"'+(d.pflegeberatung_kunde?' checked':'')+' style="width:auto"> Beratungskunde (§ 37 Abs. 3)</label></div>';
  h+='<div class="kdSec"><div class="kdSecHead"><h4>Pflegegrad</h4><button class="kdBtn" id="pgAdd">+ Pflegegrad</button></div><div id="kdPgs">';
  (d.pflegegrade||[]).forEach(function(p,i){
    h+='<div class="kdPg" data-i="'+i+'"><select data-pg="stufe">'+[1,2,3,4,5].map(function(n){return'<option'+(String(p.stufe)===String(n)?' selected':'')+'>'+n+'</option>'}).join('')+'</select><input type="text" data-pg="von" placeholder="seit TT.MM.JJJJ" value="'+esc(p.von||'')+'"><input type="text" data-pg="bis" placeholder="bis (leer = laufend)" value="'+esc(p.bis||'')+'"><label class="k"><input type="checkbox" data-pg="fortlaufend"'+(p.fortlaufend?' checked':'')+'> fortlaufend</label><label class="k"><input type="checkbox" data-pg="entlastung_genommen"'+(p.entlastung_genommen?' checked':'')+'> Entlastungsbetrag genommen</label><button class="kdX" data-pgdel="'+i+'">×</button></div>';
  });
  if(!(d.pflegegrade||[]).length)h+='<div class="kdLog">Noch kein Pflegegrad eingetragen.</div>';
  h+='</div></div>';
  h+='<div class="kdSec"><div class="kdSecHead"><h4>Angehörige / Bevollmächtigte Person</h4></div><div class="kdGrid">'+field('f_pname','Name',d.person_name)+field('f_pgeb','Geburtsdatum',d.person_geburtsdatum)+field('f_panschr','Anschrift',d.person_anschrift,{wide:1})+'</div></div>';
  var besuche=Array.isArray(d.beratungsbesuche)?d.beratungsbesuche:[];
  h+='<div class="kdSec"><div class="kdSecHead"><h4>Beratungsbesuche ('+besuche.length+')</h4>'+(c.isNew?'':'<a class="kdBtn primary" style="text-decoration:none" href="besuch.html?kunde='+esc(c.id)+'">+ Neuer Beratungsbesuch</a>')+'</div>';
  if(!besuche.length)h+='<div class="kdLog">Noch keine Besuche erfasst.</div>';
  besuche.map(function(x,i){return[x,i]}).reverse().forEach(function(pair){
    var x=pair[0],i=pair[1],st=x.status||{};
    h+='<div class="kdBes" data-bi="'+i+'"><div class="kdRow"><b style="flex:1">'+esc(x.datum||'')+' '+esc(x.uhrzeit_von||'')+(x.uhrzeit_bis?'–'+esc(x.uhrzeit_bis):'')+' · '+esc(x.beratungsperson_name||'')+(x.form==='videokonferenz'?' · Video':'')+'</b>'+(c.isNew?'':'<button class="kdBtn" data-nw="'+i+'">Nachweis (PDF) erstellen</button>')+'</div>'+
      '<div class="grid"><div><label>Nächster Termin</label><input type="text" data-st="naechster_termin" value="'+esc(st.naechster_termin||'')+'" placeholder="TT.MM.JJJJ"></div>'+
      '<div><label>An Kasse übermittelt am</label><input type="text" data-st="uebermittelt_am" value="'+esc(st.uebermittelt_am||'')+'" placeholder="TT.MM.JJJJ"></div>'+
      '<div><label>Zahlungsstatus</label><select data-st="zahlungsstatus">'+['offen','abgerechnet','bezahlt'].map(function(o){return'<option'+((st.zahlungsstatus||'offen')===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select></div>'+
      '<div><label>Übermittlungsweg</label><input type="text" data-st="uebermittlungsweg" value="'+esc(st.uebermittlungsweg||'')+'" placeholder="Portal, Post, Mail …"></div>'+
      '<div><label>Vorgangsnummer</label><input type="text" data-st="vorgangsnummer" value="'+esc(st.vorgangsnummer||'')+'"></div>'+
      '<div><label>Vergütung (€)</label><input type="text" data-st="verguetung" value="'+esc(st.verguetung||'')+'"></div></div></div>';
  });
  h+='</div>';
  if(d.pflege_sig_dataurl)h+='<div class="kdSec"><div class="kdSecHead"><h4>Unterschrift (Stammdaten)</h4></div><img class="kdSig" src="'+esc(d.pflege_sig_dataurl)+'" alt="Unterschrift"></div>';
  if(!c.isNew){
    h+='<div class="kdSec"><div class="kdSecHead"><h4>Dokumente</h4><div class="kdRow"><select id="docArt" style="width:auto">'+Object.keys(ARTEN).map(function(k){return'<option value="'+k+'">'+ARTEN[k]+'</option>'}).join('')+'</select><label class="kdBtn" style="cursor:pointer">+ Datei<input type="file" id="docFile" multiple style="display:none"></label></div></div><div class="kdRow" style="margin-bottom:8px"><button class="kdBtn" data-unt="datenschutz">Datenschutzinformation erstellen</button><button class="kdBtn" data-unt="vereinbarung">Beratungsvereinbarung erstellen</button>'+(H().isAdmin?'<button class="kdBtn" data-unt="vollmacht">Vollmacht Beratungsperson erstellen</button>':'')+'</div>';
    c.dok.forEach(function(x){h+='<div class="kdFile"><span class="kdChip">'+esc(ARTEN[x.art]||x.art)+'</span><a data-dok="'+x.id+'">'+esc(x.file_name)+'</a><span class="kdLog">'+bytesFmt(x.size)+' · '+fmtTs(x.created_at)+'</span><button class="kdX" data-dokdel="'+x.id+'">×</button></div>'});
    if(!c.dok.length)h+='<div class="kdLog">Noch keine Dokumente.</div>';
    h+='</div>';
    h+='<div class="kdRow" style="justify-content:space-between;margin-top:22px"><button class="kdBtn '+(c.aktiv?'danger':'')+'" id="kdAktiv">'+(c.aktiv?'Deaktivieren':'Wieder aktivieren')+'</button><span class="kdLog">Version '+esc(c.version)+'</span></div>';
  }
  h+='</div></div>';
  var bg=$('.kdModalBg');var sc=bg?bg.scrollTop:0;
  $('#kdModalHost').innerHTML=h;
  var nb=$('.kdModalBg');if(nb)nb.scrollTop=sc;
}
function collect(){
  var c=S.cur,d=c.data;
  var v=function(id){return($('#'+id)||{}).value||''};
  d.pflege_name=v('f_name').trim();d.pflege_geburtsdatum=v('f_geb').trim();d.pflege_kvnr=v('f_kvnr').trim();d.pflege_kasse=v('f_kasse').trim();d.pflege_anschrift=v('f_anschr').trim();
  d.person_name=v('f_pname').trim();d.person_geburtsdatum=v('f_pgeb').trim();d.person_anschrift=v('f_panschr').trim();
  d.pflegeberatung_kunde=!!($('#f_ber')||{}).checked;
  var pgs=[];
  S.root.querySelectorAll('.kdPg').forEach(function(row){
    var p={};row.querySelectorAll('[data-pg]').forEach(function(el){var k=el.dataset.pg;p[k]=el.type==='checkbox'?el.checked:el.value.trim()});
    p.stufe=Number(p.stufe)||p.stufe;pgs.push(p);
  });
  d.pflegegrade=pgs;
  S.root.querySelectorAll('.kdBes').forEach(function(box){
    var i=Number(box.dataset.bi),b=(d.beratungsbesuche||[])[i];if(!b)return;
    b.status=b.status&&typeof b.status==='object'?b.status:{};
    box.querySelectorAll('[data-st]').forEach(function(el){b.status[el.dataset.st]=el.value.trim()});
  });
}
async function save(){
  collect();var c=S.cur;
  if(!c.data.pflege_name){msg('Bitte den Namen eintragen.',true);return}
  var r=await call('kunden_save',{id:c.id,version:c.version,data:c.data});
  if(!r.ok){
    if(r.duplicate&&await dlg({title:'Akte existiert schon',text:'Es gibt bereits eine Akte mit diesem Namen. Diese öffnen?',ok:'Öffnen'})){await openKunde(r.id);return}
    msg(r.message||'Speichern fehlgeschlagen.',true);return;
  }
  msg('Gespeichert');
  S.cur.id=r.kunde.id;S.cur.version=r.kunde.version;S.cur.isNew=false;
  var i=S.list.findIndex(function(k){return k.id===r.kunde.id});
  var row={id:r.kunde.id,name:r.kunde.name,aktiv:r.kunde.aktiv,summary:r.kunde.summary,updated_at:r.kunde.updated_at,version:r.kunde.version};
  if(i>=0)S.list[i]=row;else S.list.push(row);
  S.list.sort(function(a,b){return a.name.localeCompare(b.name,'de')});
  await openKunde(r.kunde.id);
}
function closeKunde(){S.cur=null;$('#kdModalHost').innerHTML='';render()}
async function uploadFiles(files){
  var c=S.cur,art=($('#docArt')||{}).value||'sonstiges';
  for(var i=0;i<files.length;i++){
    var f=files[i];if(f.size>10*1024*1024){msg(f.name+' ist größer als 10 MB.',true);continue}
    var b64=await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1]||'')};fr.onerror=rej;fr.readAsDataURL(f)});
    msg('Lade '+f.name+' hoch …');
    var r=await call('kunden_dok_add',{kunde_id:c.id,art:art,file_name:f.name,content_type:f.type,file_b64:b64});
    if(!r.ok)msg(r.message||'Upload fehlgeschlagen.',true);
  }
  var g=await call('kunden_get',{id:c.id});if(g.ok){c.dok=g.dokumente||[];draw()}
}

/* ---------- Nachweis (PDF) erzeugen und in der Akte ablegen ---------- */
function bytesToB64(u8){var s='';for(var i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
async function nachweisFuer(i){
  var c=S.cur,b=(c.data.beratungsbesuche||[])[i];if(!b)return;
  if(!window.NW||!window.PDFLib){msg('PDF-Baustein nicht geladen (Internetverbindung prüfen).',true);return}
  collect();
  var cf=await call('app_config_get');var cfg=(cf.ok&&cf.config)||{};
  if(!cfg.ik||!(cfg.kassen&&cfg.kassen.length)){msg('Die Konfiguration (IK-Nummer, Kassenliste) fehlt – bitte einen Administrator unter Import einspielen lassen.',true);return}
  msg('Nachweis wird erstellt …');
  try{
    var assets=await NW.laden('');
    var bytes=await NW.erzeugen(assets,c.data,b,{ik:cfg.ik||'',kassen:cfg.kassen||[],sigPersonen:cfg.unterschriften||{}});
    var fn='Nachweis_'+String(b.datum||'Besuch').replace(/[^\w.-]/g,'_')+'.pdf';
    var up=await call('kunden_dok_add',{kunde_id:c.id,art:'nachweis',titel:'Nachweis '+(b.datum||''),file_name:fn,content_type:'application/pdf',file_b64:bytesToB64(bytes)});
    if(!up.ok){msg(up.message||'Ablegen fehlgeschlagen.',true);return}
    window.open(URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),'_blank');
    var g=await call('kunden_get',{id:c.id});if(g.ok){c.dok=g.dokumente||[];draw()}
    msg('Nachweis erstellt und in der Akte abgelegt');
  }catch(e){msg('Nachweis konnte nicht erstellt werden: '+(e&&e.message||e),true)}
}

/* ---------- Beratungsunterlagen aus der Akte erstellen ---------- */
async function unterlageErstellen(id){
  var c=S.cur;if(c.isNew){msg('Bitte die Akte zuerst speichern.',true);return}
  if(!window.DOK||!window.PDFLib){msg('PDF-Baustein nicht geladen (Internetverbindung prüfen).',true);return}
  collect();
  var cf=await call('app_config_get');var cfg=(cf.ok&&cf.config)||{};
  if(!cfg.traeger||!cfg.traeger.map){msg('Die Konfiguration (Träger-Daten) fehlt – bitte einen Administrator unter Import einspielen lassen.',true);return}
  var t=new Date(),p=function(n){return String(n).padStart(2,'0')},datum=p(t.getDate())+'.'+p(t.getMonth()+1)+'.'+t.getFullYear();
  var a=String(c.data.pflege_anschrift||''),m=/\b\d{5}\s+(.+?)\s*$/.exec(a),ort=m?m[1].trim():(a.indexOf(',')>=0?a.split(',').pop().trim():'Rheda-Wiedenbrück');
  if(id==='vollmacht')ort='Rheda-Wiedenbrück';
  msg('Dokument wird erstellt …');
  try{
    var u=await DOK.unterlage(id,{kunde:c.data,cfg:cfg,ort:ort,datum:datum,sigKunde:c.data.pflege_sig_dataurl||''},'');
    var up=await call('kunden_dok_add',{kunde_id:c.id,art:u.art,titel:u.titel,file_name:u.fileName,content_type:'application/pdf',file_b64:bytesToB64(u.bytes)});
    if(!up.ok){msg(up.message||'Ablegen fehlgeschlagen.',true);return}
    window.open(URL.createObjectURL(new Blob([u.bytes],{type:'application/pdf'})),'_blank');
    var g=await call('kunden_get',{id:c.id});if(g.ok){c.dok=g.dokumente||[];draw()}
    msg('Erstellt und in der Akte abgelegt');
  }catch(e){msg('Dokument konnte nicht erstellt werden: '+(e&&e.message||e),true)}
}

/* ---------- Import aus Studio (Admin) ---------- */
var KEEP=['pflege_name','pflege_anschrift','pflege_kvnr','pflege_kasse','pflege_geburtsdatum','pflege_sig_dataurl','person_name','person_anschrift','person_geburtsdatum','person_kvnr','person_sig_dataurl','pflegegrade','pflegeberatung_kunde','beratungsbesuche','beratung_kalender','leistungsbeziehungen'];
function slim(d){var o={};KEEP.forEach(function(k){if(d[k]!==undefined&&d[k]!==null&&d[k]!=='')o[k]=d[k]});return o}
async function runImport(){
  var host=$('#kdModalHost');
  host.innerHTML='<div class="kdModalBg"><div class="kdModal small"><h3>Import aus Studio</h3><p style="color:var(--k-muted)">Wählen Sie „Curafact_Kundenimport_Beratung.json“ (Kunden) und/oder „Curafact_Konfig_Import.json“ (Beratungspersonen, Textbausteine, Kassen, Unterschriften) – beide Dateien auf einmal geht auch. Aus Studio-Dateien werden nur die Felder für die Pflegeberatung übernommen. Bestehende Namen werden übersprungen.</p><input type="file" id="kdImpFile" accept=".json,application/json" multiple><div id="kdImpOut"></div><div class="kdRow" style="justify-content:flex-end;margin-top:14px"><button class="kdBtn" id="kdImpClose">Schließen</button></div></div></div>';
  $('#kdImpClose',host).onclick=function(){host.innerHTML='';load().then(render)};
  $('#kdImpFile',host).onchange=async function(e){
    var out=$('#kdImpOut',host);var items=[];
    for(var i=0;i<e.target.files.length;i++){
      try{var j=JSON.parse(await e.target.files[i].text());
        if(!Array.isArray(j)&&(j.textbausteine||j.personen||j.kassen)){var cr=await call('app_config_import',{config:j});out.innerHTML+='<div class="kdLog">'+esc(e.target.files[i].name)+': Konfiguration '+(cr.ok?'übernommen ('+cr.saved+' Bereiche)':'FEHLER: '+esc(cr.message||''))+'</div>';continue}
        if(Array.isArray(j))j.forEach(function(x){items.push(slim(x))});else items.push(slim(j))}catch(err){out.innerHTML+='<div class="kdLog">'+esc(e.target.files[i].name)+': keine gültige JSON-Datei</div>'}
    }
    items=items.filter(function(x){return x.pflege_name});
    if(!items.length){return}
    var imp=0,skip=0,fail=[];
    for(var k=0;k<items.length;k+=10){
      out.innerHTML='<div class="kdProg"><i style="width:'+Math.round(k*100/items.length)+'%"></i></div><div class="kdLog">'+k+' von '+items.length+' …</div>';
      var r=await call('kunden_import',{items:items.slice(k,k+10)});
      if(!r.ok){out.innerHTML='<div class="kdLog" style="color:#b91c1c">'+esc(r.message||'Fehler')+'</div>';return}
      imp+=r.imported;skip+=r.skipped;fail=fail.concat(r.failed||[]);
    }
    out.innerHTML='<p><b>Fertig.</b> '+imp+' übernommen, '+skip+' übersprungen (gab es schon)'+(fail.length?', '+fail.length+' fehlgeschlagen':'')+'.</p>'+(fail.length?'<div class="kdBox">'+esc(fail.join('\n'))+'</div>':'');
  };
}

/* ---------- Ereignisse ---------- */
function bind(){
  var root=S.root;
  root.addEventListener('click',async function(e){
    var el=e.target,x;
    if(S.cur&&$('#kdBg')&&$('#kdModalHost').contains(el)){
      if(el.id==='kdClose'||el.id==='kdBg'){closeKunde();return}
      if(el.id==='kdSave'){save();return}
      if(el.id==='pgAdd'){collect();S.cur.data.pflegegrade.push({stufe:2,von:'',bis:'',fortlaufend:true,entlastung_genommen:false});draw();return}
      if((x=el.closest('[data-pgdel]'))){collect();S.cur.data.pflegegrade.splice(Number(x.dataset.pgdel),1);draw();return}
      if((x=el.closest('[data-dok]'))){var u=await call('kunden_dok_url',{id:x.dataset.dok});if(u.ok){if(H().openUrl)H().openUrl(u.url);else window.open(u.url,'_blank')}else msg(u.message,true);return}
      if((x=el.closest('[data-dokdel]'))){if(await dlg({title:'Dokument löschen?',ok:'Löschen',danger:true})){var r=await call('kunden_dok_delete',{id:x.dataset.dokdel});if(r.ok){var g=await call('kunden_get',{id:S.cur.id});if(g.ok){S.cur.dok=g.dokumente||[];draw()}}else msg(r.message,true)}return}
      if((x=el.closest('[data-unt]'))){unterlageErstellen(x.dataset.unt);return}
      if((x=el.closest('[data-nw]'))){nachweisFuer(Number(x.dataset.nw));return}
      if(el.id==='kdAktiv'){var neu=!S.cur.aktiv;if(await dlg({title:neu?'Wieder aktivieren?':'Kunde deaktivieren?',text:neu?'':'Die Akte bleibt erhalten, erscheint aber nicht mehr unter „Aktive“.',ok:neu?'Aktivieren':'Deaktivieren',danger:!neu})){var r2=await call('kunden_set_aktiv',{id:S.cur.id,aktiv:neu});if(r2.ok){var i=S.list.findIndex(function(k){return k.id===S.cur.id});if(i>=0)S.list[i].aktiv=neu;closeKunde()}else msg(r2.message,true)}return}
      return;
    }
    if(el.id==='kdNew'){newKunde();return}
    if(el.id==='kdImport'){runImport();return}
    if(el.id==='kdReload'){if(await load())render();return}
    if((x=el.closest('[data-filter]'))){S.filter=x.dataset.filter;render();return}
    if((x=el.closest('tr.row,.kdFaellig .it'))){openKunde(x.dataset.id);return}
  });
  root.addEventListener('input',function(e){
    if(e.target.id==='kdQ'){S.q=e.target.value;clearTimeout(S.qt);S.qt=setTimeout(function(){var p=e.target.selectionStart;render();var q=$('#kdQ');q.focus();q.setSelectionRange(p,p)},200)}
  });
  root.addEventListener('change',function(e){if(e.target.id==='docFile')uploadFiles(e.target.files)});
}
var KD={
  async init(rootEl){S.root=rootEl;shell();bind();$('#kdBody').innerHTML='<div class="kdEmpty">Lade Kunden …</div>';if(await load())render()},
  async show(){if(!S.root)return;if(S.cur)return;if(await load())render()},
  open:function(id){return openKunde(id)}
};
window.KD=KD;
})();
</script>
<!--KD:END-->
<script>
(function(){
  var LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var API=LOCAL?(location.protocol+'//'+location.hostname+':8799'):'https://vdqumlxjmgqrmwlxqwre.supabase.co/functions/v1/studio-api';
  var KEY='curafact_app_session',IDLE=60*60*1000;
  var sess=null,started={},idleT=null;
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.token&&Date.now()-s.last<IDLE)return s}catch(e){}return null}
  function save(){try{if(sess)localStorage.setItem(KEY,JSON.stringify(sess));else localStorage.removeItem(KEY)}catch(e){}}
  function show(app){document.getElementById('login').classList.toggle('hidden',app);document.getElementById('app').classList.toggle('hidden',!app)}
  function logout(msg){
    if(sess){fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-curafact-session':sess.token},body:JSON.stringify({action:'logout'})}).catch(function(){})}
    sess=null;save();show(false);if(window.BD)BD.stop();started={};document.getElementById('bdRoot').innerHTML='';document.getElementById('kdRoot').innerHTML='';
    document.getElementById('loginErr').textContent=msg||'';document.getElementById('code').value='';
  }
  function touch(){if(sess){sess.last=Date.now();save()}}
  ['click','keydown','touchstart','mousemove'].forEach(function(ev){window.addEventListener(ev,function(){if(sess&&Date.now()-sess.last>15000)touch()},{passive:true})});
  setInterval(function(){if(sess&&Date.now()-sess.last>IDLE)logout('Aus Sicherheitsgründen abgemeldet (keine Aktivität).')},30000);
  async function post(action,params){
    var h={'Content-Type':'application/json'};if(sess)h['x-curafact-session']=sess.token;
    var r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(Object.assign({action:action},params||{}))});
    var j=null;try{j=await r.json()}catch(e){}
    if(!j)return{ok:false,message:'Server-Fehler '+r.status};
    if(j.auth_required){logout('Sitzung abgelaufen. Bitte neu anmelden.')}
    return j;
  }
  window.BD_HOST={
    call:post,
    get user(){return(sess&&sess.user)||{}},
    get isAdmin(){return !!sess&&(sess.user.role==='admin'||sess.user.role==='superadmin')},
    openUrl:function(u){window.open(u,'_blank')}
  };
  function tab(name){
    ['kunden','board'].forEach(function(t){document.getElementById('tab-'+t).classList.toggle('hidden',t!==name)});
    document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===name)});
    try{history.replaceState(null,'',location.pathname+location.search+'#'+name)}catch(e){}
    if(!started[name]){started[name]=true;(name==='board'?BD:KD).init(document.getElementById(name==='board'?'bdRoot':'kdRoot'))}
    else (name==='board'?BD:KD).show();
  }
  document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(b)tab(b.dataset.tab)});
  function start(){
    show(true);
    document.getElementById('who').innerHTML='Angemeldet: <strong>'+(sess.user.display_name||sess.user.username).replace(/[<>&]/g,'')+'</strong>';
    var want=(location.hash||'').replace('#','');
    if(/[?&]task=/.test(location.search))want='board';
    tab(want==='board'?'board':'kunden');
  }
  document.getElementById('logout').onclick=function(){logout('')};
  document.getElementById('loginForm').addEventListener('submit',async function(e){
    e.preventDefault();var u=document.getElementById('user').value.trim().toLowerCase(),c=document.getElementById('code').value.replace(/\s+/g,'');
    var err=document.getElementById('loginErr');err.textContent='';
    if(!u||!c){err.textContent='Bitte Benutzername und Code eingeben.';return}
    var r=await post('login',{username:u,code:c});
    if(!r.ok){err.textContent=r.message||'Anmeldung fehlgeschlagen.';return}
    sess={token:r.token,user:r.user,last:Date.now()};save();start();
  });
  sess=load();
  if(sess)start();else show(false);
})();
</script>
